<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f4f6f8; --card: #ffffff; --ink: #1f2933; --muted: #6b7785;
      --line: #e2e8f0; --accent: #2563eb; --accent-d: #1d4ed8;
      --ok: #16a34a; --warn: #d97706; --err: #dc2626; --ask: #7c3aed;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg); color: var(--ink); padding: 16px; }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 4px 0 2px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .target { font-size: 12px; color: var(--accent-d); background: #eff6ff;
      border: 1px solid #bfdbfe; border-radius: 8px; padding: 7px 10px; margin-bottom: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px 14px;
      text-align: center; color: var(--muted); cursor: pointer; transition: .15s; }
    .drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); background: #f0f6ff; }
    .drop strong { color: var(--ink); }
    #preview { display: none; width: 100%; border-radius: 10px; margin-top: 12px; border: 1px solid var(--line); }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
    input, select { width: 100%; padding: 10px 11px; font-size: 15px; border: 1px solid var(--line);
      border-radius: 9px; background: #fff; color: var(--ink); }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; border: none;
      border-radius: 10px; cursor: pointer; transition: .15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-d); }
    .btn-ghost { background: #eef2f7; color: var(--ink); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .hidden { display: none; }
    .ask-box { border: 1px solid #ddd6fe; background: #faf5ff; border-radius: 12px;
      padding: 12px 12px 14px; margin-top: 14px; }
    .ask-title { font-size: 12px; font-weight: 700; color: var(--ask); text-transform: uppercase; letter-spacing: .03em; }
    .ask-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px;
      background: #fff; cursor: pointer; }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .msg { padding: 10px 12px; border-radius: 9px; font-size: 13px; margin-top: 12px; }
    .msg.ok { background: #ecfdf3; color: var(--ok); border: 1px solid #bbf7d0; }
    .msg.err { background: #fef2f2; color: var(--err); border: 1px solid #fecaca; }
    .msg.info { background: #eff6ff; color: var(--accent-d); border: 1px solid #bfdbfe; }
    .spin { display: inline-block; width: 15px; height: 15px; border: 2px solid #fff;
      border-top-color: transparent; border-radius: 50%; animation: sp .7s linear infinite;
      vertical-align: -2px; margin-right: 7px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .pill.tinggi { background: #ecfdf3; color: var(--ok); }
    .pill.sedang { background: #fffbeb; color: var(--warn); }
    .pill.rendah { background: #fef2f2; color: var(--err); }
    .note { font-size: 12px; color: var(--warn); margin-top: 8px; }
    .note.boc { color: var(--ask); }
    .nominal-prefix { position: relative; }
    .nominal-prefix span { position: absolute; left: 11px; top: 11px; color: var(--muted); font-size: 15px; }
    .nominal-prefix input { padding-left: 30px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>💸 Dashboard Biaya Harian</h1>
    <div class="sub">Unggah bukti → dibaca otomatis → konfirmasi → simpan ke sheet TRANSAKSI.</div>
    <div id="target" class="target">Memeriksa baris kosong terbawah…</div>

    <!-- Langkah 1: Upload -->
    <div class="card">
      <div id="drop" class="drop">
        <div style="font-size:28px">📷</div>
        <div><strong>Ketuk untuk pilih gambar</strong> atau jatuhkan di sini</div>
        <div style="font-size:12px;margin-top:4px">PNG / JPG · screenshot atau foto bukti transfer</div>
      </div>
      <input id="file" type="file" accept="image/*" class="hidden">
      <img id="preview" alt="preview">
      <button id="btnAnalyze" class="btn-primary hidden" style="margin-top:12px" onclick="analyze()">
        Baca Otomatis
      </button>
    </div>

    <!-- Langkah 2: Form -->
    <div id="formCard" class="card hidden">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong style="font-size:15px">Tinjau & Konfirmasi</strong>
        <span id="confPill" class="pill"></span>
      </div>
      <div id="catatan" class="note hidden"></div>

      <!-- Dibaca dari bukti (boleh dikoreksi) -->
      <label>POS BIAYA <span style="color:var(--muted);font-weight:400">(pilih dari daftar)</span></label>
      <select id="posBiaya" onchange="onPosChange()"></select>

      <label>KETERANGAN</label>
      <input id="keterangan" type="text" list="ketList" autocomplete="off" placeholder="(ketik atau pilih rekomendasi)">
      <datalist id="ketList"></datalist>
      <div id="ketChips" class="chips"></div>

      <label>NOMINAL</label>
      <div class="nominal-prefix">
        <span>Rp</span>
        <input id="nominal" type="text" inputmode="numeric" placeholder="0" oninput="onNominalInput()">
      </div>
      <div id="kursNote" class="note hidden" style="color:var(--muted)"></div>

      <label>TANGGAL <span style="color:var(--muted);font-weight:400">(dari bukti)</span></label>
      <input id="tanggal" type="date" onchange="onTanggalChange()">

      <!-- Wajib dipilih pemilik -->
      <div class="ask-box">
        <div class="ask-title">✅ Terisi otomatis dari history — konfirmasi</div>
        <div id="askHint" class="ask-hint"></div>

        <label>SUMBER DANA</label>
        <select id="sumberDana" onchange="onSumberDanaChange()"></select>
        <div id="bocNote" class="note boc hidden"></div>

        <div id="rekWrap" class="hidden">
          <label>Rekening <span style="color:var(--muted);font-weight:400">(khusus Pendapatan Usaha)</span></label>
          <select id="rekening"></select>
        </div>

        <div class="grid2">
          <div>
            <label>BIAYA BULAN</label>
            <select id="biayaBulan"></select>
          </div>
          <div>
            <label>TAHUN BIAYA</label>
            <select id="tahunBiaya"></select>
          </div>
        </div>
        <div class="grid2">
          <div>
            <label>BUDGET BULAN</label>
            <select id="budgetBulan"></select>
          </div>
          <div>
            <label>TAHUN BUDGET</label>
            <select id="tahunBudget"></select>
          </div>
        </div>
      </div>

      <div class="row-btns">
        <button class="btn-ghost" onclick="resetAll()">Batal</button>
        <button id="btnSave" class="btn-primary" onclick="save()">Simpan ke Spreadsheet</button>
      </div>
    </div>

    <div id="msg"></div>
  </div>

  <script>
    var CFG = null;
    var currentDataUrl = null;

    // --- Inisialisasi ---
    google.script.run.withSuccessHandler(function (cfg) {
      CFG = cfg;
      fillSelect('posBiaya', cfg.posBiaya, true, '— pilih pos biaya —');
      fillSelect('sumberDana', cfg.sumberDana, true, '— pilih sumber dana —');
      fillSelect('biayaBulan', cfg.bulan, true, '— pilih bulan —');
      fillSelect('budgetBulan', cfg.bulan, true, '— pilih bulan —');
      buildRekening();
      // Pelajari pola SUMBER DANA per POS dari history (live).
      CFG.sumberDanaByPos = {};
      google.script.run.withSuccessHandler(function (ctx) {
        CFG.sumberDanaByPos = (ctx && ctx.sumberDanaByPos) || {};
      }).getHistoryContext();
    }).withFailureHandler(showErr).getConfig();

    refreshTarget();

    function refreshTarget() {
      google.script.run.withSuccessHandler(function (info) {
        document.getElementById('target').textContent =
          '🧾 Baris terisi terbawah: ' + info.lastRow + ' · akan disimpan ke baris ' + info.targetRow + '.';
      }).withFailureHandler(function () {}).getNextRowInfo();
    }

    function fillSelect(id, items, placeholder, phText) {
      var sel = document.getElementById(id);
      sel.innerHTML = '';
      if (placeholder) {
        var p = document.createElement('option');
        p.value = ''; p.textContent = phText || '— pilih —'; p.disabled = true; p.selected = true;
        sel.appendChild(p);
      }
      items.forEach(function (it) {
        var o = document.createElement('option');
        o.value = it; o.textContent = it; sel.appendChild(o);
      });
    }

    function buildRekening() {
      var sel = document.getElementById('rekening');
      sel.innerHTML = '';
      var kas = document.createElement('option');
      kas.value = ''; kas.textContent = '— Kas tunai usaha (kosongkan) —';
      sel.appendChild(kas);
      CFG.bankRekening.forEach(function (b) {
        var o = document.createElement('option'); o.value = b; o.textContent = b; sel.appendChild(o);
      });
    }

    // Membuat opsi tahun & memilih tahun transaksi (auto-fill, tetap bisa diubah).
    function buildYears(selId, includeYear) {
      var sel = document.getElementById(selId);
      sel.innerHTML = '';
      var years = CFG.tahun.slice();
      if (includeYear && years.indexOf(includeYear) === -1) years.push(includeYear);
      years.sort();
      var ph = document.createElement('option');
      ph.value = ''; ph.textContent = '— pilih tahun —'; ph.disabled = true;
      sel.appendChild(ph);
      years.forEach(function (y) {
        var o = document.createElement('option'); o.value = y; o.textContent = y; sel.appendChild(o);
      });
      sel.value = includeYear ? String(includeYear) : '';
    }

    // --- Upload ---
    var drop = document.getElementById('drop');
    var fileInput = document.getElementById('file');
    drop.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function (e) { if (e.target.files.length) loadFile(e.target.files[0]); });
    ['dragover', 'dragenter'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) { if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]); });

    function loadFile(file) {
      if (!file.type.match('image.*')) { showErr('File harus berupa gambar.'); return; }
      var reader = new FileReader();
      reader.onload = function (e) {
        currentDataUrl = e.target.result;
        var img = document.getElementById('preview');
        img.src = currentDataUrl; img.style.display = 'block';
        document.getElementById('btnAnalyze').classList.remove('hidden');
        clearMsg();
      };
      reader.readAsDataURL(file);
    }

    // --- Analisis ---
    function analyze() {
      if (!currentDataUrl) return;
      var btn = document.getElementById('btnAnalyze');
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Membaca gambar...';
      showInfo('Sedang membaca bukti dengan Claude…');
      google.script.run
        .withSuccessHandler(function (data) {
          btn.disabled = false; btn.textContent = 'Baca Ulang';
          fillForm(data); clearMsg();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false; btn.textContent = 'Baca Otomatis';
          showErr(err.message || err);
        })
        .analyzeImage(currentDataUrl);
    }

    function fillForm(d) {
      document.getElementById('formCard').classList.remove('hidden');

      // Dibaca dari bukti
      setSelect('posBiaya', d.pos_biaya);
      document.getElementById('keterangan').value = d.keterangan || '';
      document.getElementById('nominal').value = groupThousands(String(d.nominal || ''));
      document.getElementById('tanggal').value = d.tanggal || '';

      // Mata uang asing -> sudah dikonversi ke IDR (kurs tanggal transaksi)
      window._mataUang = d.mataUang || 'IDR';
      window._nominalAsli = d.nominalAsli || 0;
      showKursNote(d.konversi);

      // === Auto-fill dari history & pola (boleh dikoreksi) ===
      window._isBoc = !!d.is_boc_1201;
      window._bankSaran = d.bank_rekening || '';

      // Periode: BIAYA/BUDGET BULAN = bulan transaksi, TAHUN = tahun transaksi
      var my = deriveMonthYear(d.tanggal);
      setSelect('biayaBulan', my.bulan);
      setSelect('budgetBulan', my.bulan);
      buildYears('tahunBiaya', my.tahun || CFG.tahunIni);
      buildYears('tahunBudget', my.tahun || CFG.tahunIni);

      // Sumber dana: BOC(1201)->Uang Saku ; transfer bank usaha->Pendapatan Usaha ; lainnya->pola POS
      applySumberDanaSuggestion(d.pos_biaya);
      onSumberDanaChange(); // tampilkan/isi Rekening bila Pendapatan Usaha

      document.getElementById('askHint').textContent = d.tanggal
        ? ('Tanggal transaksi: ' + formatTglHint(d.tanggal) + '. Terisi otomatis dari pola — koreksi bila perlu.')
        : '⚠️ Tanggal tidak terbaca dari bukti — mohon isi tanggal (periode menyesuaikan otomatis).';

      // KETERANGAN: rekomendasi history + usulan model
      loadKeteranganOptions(d.pos_biaya, d.keterangan_opsi || [], d.keterangan_yakin);

      // Keyakinan & catatan
      var pill = document.getElementById('confPill');
      pill.textContent = 'keyakinan: ' + (d.confidence || '-');
      pill.className = 'pill ' + (d.confidence || '');
      var note = document.getElementById('catatan');
      if (d.catatan && d.catatan.trim()) { note.textContent = '⚠️ ' + d.catatan; note.classList.remove('hidden'); }
      else { note.classList.add('hidden'); }

      document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
    }

    // --- KETERANGAN: rekomendasi dari history sheet + usulan model ---
    function onPosChange() {
      var pos = document.getElementById('posBiaya').value;
      loadKeteranganOptions(pos, [], true);
      // Bila bukan BOC & bukan transfer bank, perbarui saran sumber dana dari pola POS baru.
      if (!window._isBoc && !window._bankSaran) { applySumberDanaSuggestion(pos); onSumberDanaChange(); }
    }

    // Bulan & tahun dari tanggal ISO.
    function deriveMonthYear(iso) {
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
      if (!m) return { bulan: '', tahun: '' };
      return { bulan: CFG.bulan[Number(m[2]) - 1], tahun: Number(m[1]) };
    }

    // Saran SUMBER DANA: BOC(1201)->Uang Saku; transfer bank usaha->Pendapatan Usaha; lainnya->pola history POS.
    function applySumberDanaSuggestion(pos) {
      var sd = '', note = '';
      if (window._isBoc) {
        sd = 'UANG SAKU'; note = 'Terdeteksi "BOC Debit Card (1201)" → Uang Saku.';
      } else if (window._bankSaran && CFG.bankRekening.indexOf(window._bankSaran) >= 0) {
        sd = 'PENDAPATAN USAHA'; note = 'Transfer dari ' + window._bankSaran + ' → Pendapatan Usaha.';
      } else if (CFG.sumberDanaByPos && CFG.sumberDanaByPos[pos]) {
        sd = CFG.sumberDanaByPos[pos]; note = 'Saran dari pola history untuk POS ini.';
      }
      setSelect('sumberDana', sd);
      var n = document.getElementById('bocNote');
      if (note) { n.textContent = 'ℹ️ ' + note; n.classList.remove('hidden'); }
      else { n.classList.add('hidden'); }
    }

    // Tampilkan info konversi kurs (mata uang asing -> IDR).
    function showKursNote(konv) {
      var n = document.getElementById('kursNote');
      if (!konv) { n.classList.add('hidden'); n.textContent = ''; return; }
      n.classList.remove('hidden');
      if (konv.error) {
        n.style.color = 'var(--err)';
        n.textContent = '⚠️ ' + konv.mataUang + ' ' + fmtNum(konv.nominalAsli) +
          ' — kurs gagal diambil, isi NOMINAL (Rp) manual.';
        return;
      }
      n.style.color = 'var(--muted)';
      var idr = Math.round(konv.nominalAsli * konv.rate);
      n.textContent = '💱 ' + konv.mataUang + ' ' + fmtNum(konv.nominalAsli) + ' × ' + fmtNum(konv.rate) +
        ' (kurs ' + formatTglHint(konv.tanggalKurs) + ') = Rp' + groupThousands(String(idr));
    }

    function fmtNum(x) {
      x = Number(x) || 0;
      var p = x.toFixed(x % 1 ? 2 : 0).split('.');
      p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return p.join(',');
    }
    function loadKeteranganOptions(pos, modelOpts, yakin) {
      var chips = document.getElementById('ketChips');
      chips.innerHTML = '';
      if (!pos) { document.getElementById('ketList').innerHTML = ''; return; }
      google.script.run.withSuccessHandler(function (hist) {
        // Gabungkan usulan model + history (unik), utamakan usulan model.
        var seen = {}, merged = [];
        (modelOpts || []).concat(hist || []).forEach(function (k) {
          k = (k || '').trim();
          if (k && !seen[k.toLowerCase()]) { seen[k.toLowerCase()] = 1; merged.push(k); }
        });
        // datalist (autocomplete)
        var dl = document.getElementById('ketList');
        dl.innerHTML = '';
        merged.forEach(function (k) { var o = document.createElement('option'); o.value = k; dl.appendChild(o); });
        // chips (klik untuk mengisi)
        chips.innerHTML = '';
        if (!yakin && merged.length) {
          var lbl = document.createElement('div');
          lbl.className = 'ask-hint'; lbl.style.width = '100%';
          lbl.textContent = 'Rekomendasi keterangan — ketuk untuk pilih:';
          chips.appendChild(lbl);
        }
        merged.slice(0, 10).forEach(function (k) {
          var c = document.createElement('span'); c.className = 'chip'; c.textContent = k;
          c.onclick = function () { document.getElementById('keterangan').value = k; };
          chips.appendChild(c);
        });
      }).withFailureHandler(function (e) {
        chips.innerHTML = '<span class="ask-hint" style="color:var(--err)">⚠️ Gagal memuat rekomendasi keterangan: '
          + (e && e.message ? e.message : e) + '</span>';
      }).getKeteranganOptions(pos);
    }

    // --- Sumber dana -> tampilkan/atur Rekening ---
    function onSumberDanaChange() {
      var sd = document.getElementById('sumberDana').value;
      var wrap = document.getElementById('rekWrap');
      if (sd === CFG.sumberDanaRekening) {
        wrap.classList.remove('hidden');
        var bank = window._bankSaran || '';
        document.getElementById('rekening').value = (CFG.bankRekening.indexOf(bank) >= 0) ? bank : '';
      } else {
        wrap.classList.add('hidden');
        document.getElementById('rekening').value = '';
      }
    }

    function onTanggalChange() {
      var v = document.getElementById('tanggal').value;
      var my = deriveMonthYear(v);
      if (my.bulan) {
        setSelect('biayaBulan', my.bulan); setSelect('budgetBulan', my.bulan);
        buildYears('tahunBiaya', my.tahun); buildYears('tahunBudget', my.tahun);
        document.getElementById('askHint').textContent =
          'Tanggal transaksi: ' + formatTglHint(v) + '. Terisi otomatis dari pola — koreksi bila perlu.';
      }
      // Mata uang asing -> hitung ulang kurs di tanggal baru.
      if (window._mataUang && window._mataUang !== 'IDR' && window._nominalAsli > 0 && v) {
        google.script.run.withSuccessHandler(function (res) {
          document.getElementById('nominal').value = groupThousands(String(res.idr));
          showKursNote({ mataUang: window._mataUang, nominalAsli: window._nominalAsli, rate: res.rate, tanggalKurs: res.date });
        }).withFailureHandler(function () {
          showKursNote({ error: true, mataUang: window._mataUang, nominalAsli: window._nominalAsli });
        }).convertCurrency(window._nominalAsli, window._mataUang, v);
      }
    }

    function setSelect(id, val) {
      var sel = document.getElementById(id);
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === val) { sel.selectedIndex = i; return; }
      }
    }

    // --- Nominal format ---
    function onNominalInput() {
      var el = document.getElementById('nominal'); el.value = groupThousands(el.value);
    }
    function groupThousands(s) {
      var d = String(s).replace(/[^\d]/g, '');
      return d ? d.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
    }
    function unformatNominal() { return Number(document.getElementById('nominal').value.replace(/[^\d]/g, '')); }

    function formatTglHint(iso) {
      var b = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso); if (!m) return iso;
      return Number(m[3]) + ' ' + b[Number(m[2]) - 1] + ' ' + m[1];
    }

    // --- Simpan ---
    function save() {
      var sd = document.getElementById('sumberDana').value;
      var payload = {
        posBiaya: document.getElementById('posBiaya').value,
        keterangan: document.getElementById('keterangan').value.trim(),
        nominal: unformatNominal(),
        tanggal: document.getElementById('tanggal').value,
        sumberDana: sd,
        biayaBulan: document.getElementById('biayaBulan').value,
        tahunBiaya: document.getElementById('tahunBiaya').value,
        budgetBulan: document.getElementById('budgetBulan').value,
        tahunBudget: document.getElementById('tahunBudget').value,
        rekening: (sd === CFG.sumberDanaRekening) ? document.getElementById('rekening').value : ''
      };

      // Validasi sesuai aturan
      if (!payload.posBiaya) return showErr('POS BIAYA wajib dipilih.');
      if (!(payload.nominal > 0)) return showErr('Nominal harus lebih dari 0.');
      if (!payload.tanggal) return showErr('Tanggal wajib diisi (dari bukti).');
      if (!payload.sumberDana) return showErr('Sumber Dana wajib dipilih.');
      if (!payload.biayaBulan) return showErr('Biaya Bulan wajib dipilih.');
      if (!payload.tahunBiaya) return showErr('Tahun Biaya wajib dipilih.');
      if (!payload.budgetBulan) return showErr('Budget Bulan wajib dipilih.');
      if (!payload.tahunBudget) return showErr('Tahun Budget wajib dipilih.');

      var btn = document.getElementById('btnSave');
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Menyimpan...';
      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false; btn.textContent = 'Simpan ke Spreadsheet';
          showOk('✅ Tersimpan ke baris ' + res.row + ' pada sheet TRANSAKSI.');
          resetAll(); refreshTarget();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false; btn.textContent = 'Simpan ke Spreadsheet';
          showErr(err.message || err);
        })
        .appendTransaction(payload);
    }

    function resetAll() {
      currentDataUrl = null;
      window._bankSaran = ''; window._isBoc = false; window._mataUang = 'IDR'; window._nominalAsli = 0;
      fileInput.value = '';
      var img = document.getElementById('preview'); img.src = ''; img.style.display = 'none';
      document.getElementById('btnAnalyze').classList.add('hidden');
      document.getElementById('btnAnalyze').textContent = 'Baca Otomatis';
      document.getElementById('formCard').classList.add('hidden');
      document.getElementById('ketChips').innerHTML = '';
      document.getElementById('rekWrap').classList.add('hidden');
      document.getElementById('bocNote').classList.add('hidden');
      document.getElementById('kursNote').classList.add('hidden');
    }

    // --- Pesan ---
    function showOk(t) { setMsg(t, 'ok'); }
    function showErr(e) { setMsg(typeof e === 'string' ? e : (e.message || 'Terjadi kesalahan.'), 'err'); }
    function showInfo(t) { setMsg(t, 'info'); }
    function clearMsg() { document.getElementById('msg').innerHTML = ''; }
    function setMsg(t, cls) { document.getElementById('msg').innerHTML = '<div class="msg ' + cls + '">' + t + '</div>'; }
  </script>
</body>
</html>

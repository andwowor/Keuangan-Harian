<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11606e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Keuangan">
  <title>Keuangan Harian</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f0e2;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    #app { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; }
    .setup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px;
      background: radial-gradient(120% 70% at 50% -10%, #18788a 0%, #11606e 38%, #0d4a57 100%); z-index: 20; }
    .box { max-width: 440px; width: 100%; background: #fffdf6; border: 1px solid #e3ded0; border-radius: 18px;
      padding: 26px 22px; box-shadow: 0 18px 50px rgba(13,74,87,.35); text-align: center; }
    .mark { width: 64px; height: 64px; color: #11606e; margin-bottom: 6px; }
    h1 { font-size: 17px; margin: 0 0 2px; color: #123c46; letter-spacing: .12em; font-weight: 800; }
    .sub { color: #11606e; font-size: 11px; letter-spacing: .28em; font-weight: 600; margin-bottom: 12px; }
    p { color: #5f7780; font-size: 13px; line-height: 1.5; text-align: left; }
    code { background: #eef3f2; padding: 1px 5px; border-radius: 5px; font-size: 12px; color: #11606e; }
    input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 14px; border: 1px solid #d9d3c3; border-radius: 10px; margin-top: 10px; background: #fff; }
    button { width: 100%; padding: 13px; margin-top: 12px; border: 0; border-radius: 12px; background: #11606e; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
    .gear { position: fixed; right: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%;
      background: rgba(13,74,87,.55); color: #fff; border: 0; font-size: 18px; display: none; z-index: 5; padding: 0; }
    .err { color: #c0492f; }
  </style>
</head>
<body>
  <div id="setup" class="setup" style="display:none">
    <div class="box">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="11"/>
        <circle cx="50" cy="50" r="22" fill="none" stroke="currentColor" stroke-width="9"/>
        <circle cx="50" cy="50" r="6.5" fill="currentColor"/>
      </svg>
      <h1>CO CLEAN</h1>
      <div class="sub">LAUNDRY</div>
      <p>Tempel <b>Web app URL</b> Apps Script Anda (yang berakhiran <code>/exec</code>). Hanya disimpan di perangkat ini.</p>
      <input id="url" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
      <button onclick="saveUrl()">Simpan & Buka</button>
      <p id="err" class="err"></p>
    </div>
  </div>

  <iframe id="app" title="Keuangan Harian" allow="camera; clipboard-write"></iframe>
  <button class="gear" id="gear" onclick="openSetup()" title="Ganti URL">⚙</button>

  <script>
    function getUrl() { return localStorage.getItem('appUrl') || ''; }
    function openSetup() { document.getElementById('url').value = getUrl(); document.getElementById('setup').style.display = 'flex'; }
    function saveUrl() {
      var u = document.getElementById('url').value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec\b/.test(u)) {
        document.getElementById('err').textContent = 'URL harus dari Apps Script dan berakhiran /exec.'; return;
      }
      localStorage.setItem('appUrl', u); location.reload();
    }
    (function () {
      var u = getUrl();
      var app = document.getElementById('app');
      if (!u) {
        // Belum ada URL: sembunyikan iframe agar tidak menutupi kotak setup.
        app.style.display = 'none';
        document.getElementById('setup').style.display = 'flex';
      } else {
        app.style.display = 'block';
        app.src = u;
        document.getElementById('gear').style.display = 'block';
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    })();
  </script>
</body>
</html>

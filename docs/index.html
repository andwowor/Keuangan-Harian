<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F7F9">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Keuangan">
  <title>Keuangan Harian</title>
  <style>
    html, body { margin: 0; height: 100%; color: #16181D; background: #F6F7F9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; }
    #app { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; }
    .setup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
    .box { max-width: 440px; width: 100%; background: #fff; border: 1px solid #E4E7EC;
      border-radius: 14px; padding: 26px 22px; text-align: center;
      box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06); }
    .orb { width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 14px;
      background: #EEF0FE; border: 1px solid #DDE0FB;
      display: flex; align-items: center; justify-content: center; }
    .orb::after { content: "Rp"; font-weight: 800; font-size: 18px; color: #4338CA; }
    h1 { font-size: 19px; margin: 0 0 10px; font-weight: 800; color: #16181D; letter-spacing: -.02em; }
    p { color: #767C88; font-size: 13px; line-height: 1.55; text-align: left; }
    code { background: #EEF0FE; padding: 1px 5px; border-radius: 5px; font-size: 12px; color: #4338CA; }
    input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 14px; border: 1px solid #D5D9E0;
      border-radius: 10px; margin-top: 10px; background: #fff; color: #16181D; }
    input:focus { outline: none; border-color: #4F46E5; box-shadow: 0 0 0 3px rgba(79,70,229,.14); }
    button { width: 100%; padding: 13px; margin-top: 12px; border: 0; border-radius: 10px;
      background: #4F46E5; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
    button:hover { background: #4338CA; }
    .gear { position: fixed; right: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%;
      background: #fff; color: #454A54; border: 1px solid #E4E7EC; font-size: 18px; display: none;
      z-index: 5; padding: 0; box-shadow: 0 2px 8px rgba(16,24,40,.10); }
    .err { color: #C6303B; }
  </style>
</head>
<body>
  <div id="setup" class="setup" style="display:none">
    <div class="box">
      <div class="orb"></div>
      <h1>Keuangan Harian</h1>
      <p>Tempel <b>Web app URL</b> Apps Script Anda (yang berakhiran <code>/exec</code>). Hanya disimpan di perangkat ini.</p>
      <input id="url" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
      <button onclick="saveUrl()">Simpan & Buka</button>
      <p id="err" class="err"></p>
    </div>
  </div>

  <iframe id="app" title="Keuangan Harian" allow="camera; clipboard-write"></iframe>
  <button class="gear" id="gear" onclick="openSetup()" title="Ganti URL">⚙</button>

  <script>
    function getUrl() { return localStorage.getItem('appUrl') || ''; }
    function openSetup() { document.getElementById('url').value = getUrl(); document.getElementById('setup').style.display = 'flex'; }
    function saveUrl() {
      var u = document.getElementById('url').value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec\b/.test(u)) {
        document.getElementById('err').textContent = 'URL harus dari Apps Script dan berakhiran /exec.'; return;
      }
      localStorage.setItem('appUrl', u); location.reload();
    }
    (function () {
      var u = getUrl();
      var app = document.getElementById('app');
      if (!u) {
        // Belum ada URL: sembunyikan iframe agar tidak menutupi kotak setup.
        app.style.display = 'none';
        document.getElementById('setup').style.display = 'flex';
      } else {
        app.style.display = 'block';
        app.src = u;
        document.getElementById('gear').style.display = 'block';
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Keuangan">
  <title>Keuangan Harian</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f6f8;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    #app { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; }
    .setup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: #f4f6f8; z-index: 20; }
    .box { max-width: 440px; width: 100%; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 22px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { color: #6b7785; font-size: 13px; line-height: 1.5; }
    code { background: #f1f5f9; padding: 1px 5px; border-radius: 5px; font-size: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 11px; font-size: 14px; border: 1px solid #e2e8f0; border-radius: 9px; margin-top: 10px; }
    button { width: 100%; padding: 12px; margin-top: 12px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
    .gear { position: fixed; right: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%;
      background: rgba(0,0,0,.4); color: #fff; border: 0; font-size: 18px; display: none; z-index: 5; padding: 0; }
    .err { color: #dc2626; }
  </style>
</head>
<body>
  <div id="setup" class="setup" style="display:none">
    <div class="box">
      <h1>💸 Keuangan Harian</h1>
      <p>Tempel <b>Web app URL</b> Apps Script Anda (yang berakhiran <code>/exec</code>). Hanya disimpan di perangkat ini.</p>
      <input id="url" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
      <button onclick="saveUrl()">Simpan & Buka</button>
      <p id="err" class="err"></p>
    </div>
  </div>

  <iframe id="app" title="Keuangan Harian" allow="camera; clipboard-write"></iframe>
  <button class="gear" id="gear" onclick="openSetup()" title="Ganti URL">⚙</button>

  <script>
    function getUrl() { return localStorage.getItem('appUrl') || ''; }
    function openSetup() { document.getElementById('url').value = getUrl(); document.getElementById('setup').style.display = 'flex'; }
    function saveUrl() {
      var u = document.getElementById('url').value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec\b/.test(u)) {
        document.getElementById('err').textContent = 'URL harus dari Apps Script dan berakhiran /exec.'; return;
      }
      localStorage.setItem('appUrl', u); location.reload();
    }
    (function () {
      var u = getUrl();
      var app = document.getElementById('app');
      if (!u) {
        // Belum ada URL: sembunyikan iframe agar tidak menutupi kotak setup.
        app.style.display = 'none';
        document.getElementById('setup').style.display = 'flex';
      } else {
        app.style.display = 'block';
        app.src = u;
        document.getElementById('gear').style.display = 'block';
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    })();
  </script>
</body>
</html>
